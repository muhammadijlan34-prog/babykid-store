<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product | Baby Kid</title>

<link rel="stylesheet" href="add-product.css">

</head>

<body>

<header class="topbar">

<h1>Add New Product</h1>

<a href="dashboard.html">
<button class="back-btn">← Dashboard</button>
</a>

</header>

<div class="container">

<div class="form-card">

<h2>Product Details</h2>

<input
type="text"
id="productName"
placeholder="Product Name">

<input
type="number"
id="productPrice"
placeholder="Price">

<select id="productCategory">

<option>New Born</option>

<option>Boys</option>

<option>Girls</option>

<option>Accessories</option>

</select>

<textarea
id="productDescription"
placeholder="Product Description"></textarea>

<input
type="file"
id="productImage"
accept="image/*">

<button id="saveProduct">

Save Product

</button>

</div>

</div>

<script type="module" src="add-product.js"></script>

</body>

</html>
