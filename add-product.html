<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product | Baby Kid</title>

    <meta
        name="description"
        content="Add and manage Baby Kid products."
    >

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">

    <style>
        .add-product-section {
            min-height: calc(100vh - 76px);
            padding: 60px 0 80px;
            background:
                linear-gradient(
                    135deg,
                    #faf7ff 0%,
                    #ffffff 55%,
                    #f7f2ff 100%
                );
        }

        .add-product-card {
            max-width: 760px;
            margin: 0 auto;
            padding: 35px;
            border: 1px solid #eeeaf5;
            border-radius: 24px;
            background: #ffffff;
            box-shadow:
                0 18px 45px rgba(35, 20, 60, 0.08);
        }

        .add-product-heading {
            margin-bottom: 28px;
            text-align: center;
        }

        .add-product-heading span {
            color: #6d28d9;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .add-product-heading h1 {
            margin-top: 7px;
            color: #19152a;
            font-size: 34px;
            line-height: 1.2;
        }

        .add-product-heading p {
            margin-top: 8px;
            color: #766e82;
            font-size: 14px;
        }

        .add-product-form {
            display: grid;
            gap: 16px;
        }

        .form-group {
            display: grid;
            gap: 7px;
        }

        .form-group label {
            color: #332a40;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #e1d9ea;
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: #292136;
            font-size: 13px;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #8b5cf6;
            box-shadow:
                0 0 0 4px rgba(109, 40, 217, 0.08);
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .image-preview {
            display: none;
            width: 150px;
            height: 150px;
            margin-top: 8px;
            overflow: hidden;
            border-radius: 14px;
            background: #f4f0f8;
        }

        .image-preview.show {
            display: block;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .add-product-submit {
            width: 100%;
            min-height: 50px;
            margin-top: 8px;
            border: 0;
            border-radius: 11px;
            background: #6d28d9;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;

            transition:
                background 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .add-product-submit:hover {
            background: #5b21b6;
            transform: translateY(-2px);
            box-shadow:
                0 12px 25px rgba(109, 40, 217, 0.22);
        }

        .back-products {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            margin-bottom: 22px;
            border: 1px solid #ded5eb;
            border-radius: 10px;
            background: #ffffff;
            color: #4a4057;
            font-size: 13px;
            font-weight: 700;
        }

        .back-products:hover {
            color: #6d28d9;
            background: #f7f2ff;
        }

        @media (max-width: 600px) {
            .add-product-section {
                padding: 40px 0 60px;
            }

            .add-product-card {
                padding: 23px 18px;
                border-radius: 19px;
            }

            .add-product-heading h1 {
                font-size: 29px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="product-header">
        <div class="product-header-inner">

            <a
                href="index.html"
                class="product-logo"
            >
                <img
                    src="assets/logo.png"
                    alt="Baby Kid"
                >
            </a>

            <a
                href="products.html"
                class="product-back"
            >
                ← Products
            </a>

        </div>
    </header>


    <main class="add-product-section">

        <div class="container">

            <a
                href="products.html"
                class="back-products"
            >
                ← Back to Products
            </a>


            <div class="add-product-card">

                <div class="add-product-heading">

                    <span>Baby Kid</span>

                    <h1>Add New Product</h1>

                    <p>
                        Add a new kidswear product to your store.
                    </p>

                </div>


                <form
                    id="add-product-form"
                    class="add-product-form"
                >

                    <!-- Product Name -->
                    <div class="form-group">

                        <label for="product-name">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="product-name"
                            name="productName"
                            placeholder="Example: Baby Frock"
                            required
                        >

                    </div>


                    <!-- Category + Price -->
                    <div class="form-row">

                        <div class="form-group">

                            <label for="product-category">
                                Category
                            </label>

                            <select
                                id="product-category"
                                name="category"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="newborn-boys">
                                    Newborn Boys
                                </option>

                                <option value="newborn-girls">
                                    Newborn Girls
                                </option>

                                <option value="boys">
                                    Boys
                                </option>

                                <option value="girls">
                                    Girls
                                </option>

                                <option value="baby">
                                    Baby Collection
                                </option>

                                <option value="kids">
                                    Kids Collection
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="product-price">
                                Price
                            </label>

                            <input
                                type="number"
                                id="product-price"
                                name="price"
                                min="0"
                                step="1"
                                placeholder="₹ 999"
                                required
                            >

                        </div>

                    </div>


                    <!-- Old Price + Badge -->
                    <div class="form-row">

                        <div class="form-group">

                            <label for="product-old-price">
                                Old Price
                            </label>

                            <input
                                type="number"
                                id="product-old-price"
                                name="oldPrice"
                                min="0"
                                step="1"
                                placeholder="₹ 1299"
                            >

                        </div>


                        <div class="form-group">

                            <label for="product-badge">
                                Badge
                            </label>

                            <select
                                id="product-badge"
                                name="badge"
                            >

                                <option value="">
                                    No Badge
                                </option>

                                <option value="New">
                                    New
                                </option>

                                <option value="Sale">
                                    Sale
                                </option>

                                <option value="Popular">
                                    Popular
                                </option>

                                <option value="Featured">
                                    Featured
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Product Image -->
                    <div class="form-group">

                        <label for="product-image">
                            Product Image
                        </label>

                        <input
                            type="file"
                            id="product-image"
                            name="image"
                            accept="image/*"
                            required
                        >

                        <div
                            id="image-preview"
                            class="image-preview"
                        >

                            <img
                                id="preview-image"
                                src=""
                                alt="Product Preview"
                            >

                        </div>

                    </div>


                    <!-- Description -->
                    <div class="form-group">

                        <label for="product-description">
                            Product Description
                        </label>

                        <textarea
                            id="product-description"
                            name="description"
                            placeholder="Write a short description about this product..."
                            required
                        ></textarea>

                    </div>


                    <!-- Sizes -->
                    <div class="form-group">

                        <label for="product-sizes">
                            Available Sizes
                        </label>

                        <input
                            type="text"
                            id="product-sizes"
                            name="sizes"
                            placeholder="Example: 0-3M, 3-6M, 6-12M"
                        >

                    </div>


                    <button
                        type="submit"
                        class="add-product-submit"
                    >
                        Add Product
                    </button>

                </form>

            </div>

        </div>

    </main>


    <footer class="product-footer">

        <p>
            © <span id="current-year"></span>
            <strong>Baby Kid</strong>.
            All rights reserved.
        </p>

    </footer>


    <!-- Image Preview + Current Year -->
    <script>

        const imageInput =
            document.getElementById("product-image");

        const imagePreview =
            document.getElementById("image-preview");

        const previewImage =
            document.getElementById("preview-image");


        imageInput.addEventListener("change", () => {

            const file = imageInput.files[0];

            if (!file) {

                imagePreview.classList.remove("show");
                previewImage.src = "";

                return;
            }

            previewImage.src =
                URL.createObjectURL(file);

            imagePreview.classList.add("show");

        });


        document
            .getElementById("current-year")
            .textContent =
                new Date().getFullYear();

    </script>


    <!-- Add Product Logic -->
    <script
        type="module"
        src="add-product.js"
    ></script>

</body>
</html>
