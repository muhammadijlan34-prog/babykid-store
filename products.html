<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Baby Kid</title>

    <meta
        name="description"
        content="Explore Baby Kid's collection of beautiful and comfortable kidswear."
    >

    <meta
        name="keywords"
        content="Baby Kid, kids dresses, baby clothes, boys dresses, girls dresses, newborn clothes"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="product.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="site-logo"
            >

                <img
                    src="assets/logo.png"
                    alt="Baby Kid"
                >

            </a>


            <nav
                class="desktop-nav"
                aria-label="Main Navigation"
            >

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#categories">
                    Categories
                </a>

                <a
                    href="products.html"
                    aria-current="page"
                >
                    Products
                </a>

                <a href="index.html#gallery">
                    Gallery
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

            </nav>


            <div class="header-actions">

                <a
                    href="https://wa.me/919995953131"
                    class="header-whatsapp"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    WhatsApp
                </a>


                <button
                    type="button"
                    class="menu-btn"
                    id="menu-btn"
                    aria-label="Open menu"
                >
                    ☰
                </button>

            </div>

        </div>


        <!-- Mobile Navigation -->

        <nav
            class="mobile-nav"
            id="mobile-nav"
        >

            <a href="index.html">
                Home
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="index.html#gallery">
                Gallery
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- =====================================================
         PRODUCTS PAGE
    ====================================================== -->

    <main>


        <section class="products-section">

            <div class="container">


                <!-- Heading -->

                <div class="section-heading">

                    <span>
                        Baby Kid Collection
                    </span>

                    <h1>
                        Our Products
                    </h1>

                    <p>
                        Discover beautiful and comfortable
                        dresses for your little ones.
                    </p>

                </div>



                <!-- Search -->

                <div class="product-search">

                    <label
                        for="product-search"
                        class="sr-only"
                    >
                        Search products
                    </label>

                    <input
                        type="search"
                        id="product-search"
                        placeholder="Search products..."
                        autocomplete="off"
                    >

                </div>



                <!-- Category Filters -->

                <div
                    class="product-filter"
                    aria-label="Product categories"
                >

                    <button
                        type="button"
                        class="filter-btn active"
                        data-category="all"
                    >
                        All
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="newborn-boys"
                    >
                        Newborn Boys
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="newborn-girls"
                    >
                        Newborn Girls
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="boys"
                    >
                        Boys
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="girls"
                    >
                        Girls
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="baby"
                    >
                        Baby
                    </button>


                    <button
                        type="button"
                        class="filter-btn"
                        data-category="kids"
                    >
                        Kids
                    </button>

                </div>



                <!-- Product Grid -->

                <div
                    class="product-grid"
                    id="product-grid"
                >

                    <div class="product-loading">

                        Loading products...

                    </div>

                </div>


            </div>

        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    ©
                    <span id="current-year"></span>
                    <strong> Baby Kid</strong>.
                    All rights reserved.
                </p>


                <p>
                    Kidswear with love ❤️
                </p>

            </div>

        </div>

    </footer>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script>

        const menuBtn =
            document.getElementById("menu-btn");

        const mobileNav =
            document.getElementById("mobile-nav");


        if (menuBtn && mobileNav) {

            menuBtn.addEventListener(
                "click",
                () => {

                    mobileNav.classList.toggle("open");

                    document.body.classList.toggle(
                        "menu-open"
                    );

                }
            );


            mobileNav
                .querySelectorAll("a")
                .forEach(link => {

                    link.addEventListener(
                        "click",
                        () => {

                            mobileNav.classList.remove(
                                "open"
                            );

                            document.body.classList.remove(
                                "menu-open"
                            );

                        }
                    );

                });

        }


        const year =
            document.getElementById("current-year");


        if (year) {

            year.textContent =
                new Date().getFullYear();

        }

    </script>


    <!-- Firebase Products -->

    <script
        type="module"
        src="products.js"
    ></script>


</body>
</html>
