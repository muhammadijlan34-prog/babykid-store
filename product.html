<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Baby Kid - Product Details"
    >

    <meta
        name="theme-color"
        content="#6d28d9"
    >

    <title>Product | Baby Kid</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="product.css"
    >

</head>


<body>


    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="site-logo"
                aria-label="Baby Kid Home"
            >

                <img
                    src="assets/logo.png"
                    alt="Baby Kid Logo"
                >

            </a>


            <nav class="desktop-nav">

                <a href="index.html#home">
                    Home
                </a>

                <a href="index.html#categories">
                    Categories
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="index.html#gallery">
                    Gallery
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

            </nav>


            <div class="header-actions">

                <a
                    href="https://wa.me/919995953131"
                    class="header-whatsapp"
                    target="_blank"
                    rel="noopener"
                >
                    WhatsApp
                </a>

                <a
                    href="index.html"
                    class="menu-btn"
                    aria-label="Back to website"
                >
                    ☰
                </a>

            </div>

        </div>

    </header>


    <main>

        <section class="product-detail-section">

            <div class="container">

                <a
                    href="index.html#products"
                    class="product-back"
                >
                    ← Back to Products
                </a>


                <div
                    id="product-detail"
                    class="product-detail"
                >

                    <div class="product-loading">

                        <p>
                            Loading product...
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    © 2026 Baby Kid. All Rights Reserved.
                </p>

                <p>
                    Designed & Developed by
                    <strong>MIP</strong>
                </p>

            </div>

        </div>

    </footer>


    <script
        type="module"
        src="product.js"
    ></script>

</body>

</html>
