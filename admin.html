<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#6d28d9">

    <title>Baby Kid | Admin Panel</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">

        <a href="index.html" class="admin-brand">
            <img src="assets/logo.png" alt="Baby Kid Logo">
            <span>Baby Kid Admin</span>
        </a>

        <a href="index.html" class="back-home">
            View Website
        </a>

    </header>


    <main class="admin-main">

        <section class="admin-card">

            <div class="admin-heading">

                <span>Baby Kid</span>

                <h1>Admin Panel</h1>

                <p>
                    Manage products, gallery and website content.
                </p>

            </div>


            <div class="admin-actions">

                <a href="dashboard.html" class="admin-action-card">

                    <div class="admin-action-icon">
                        📊
                    </div>

                    <h2>Dashboard</h2>

                    <p>
                        View and manage your store.
                    </p>

                </a>


                <a href="add-product.html" class="admin-action-card">

                    <div class="admin-action-icon">
                        ➕
                    </div>

                    <h2>Add Product</h2>

                    <p>
                        Add new products to Baby Kid.
                    </p>

                </a>


                <a href="gallery.html" class="admin-action-card">

                    <div class="admin-action-icon">
                        🖼️
                    </div>

                    <h2>Gallery</h2>

                    <p>
                        Manage Baby Kid gallery.
                    </p>

                </a>

            </div>

        </section>

    </main>


    <footer class="admin-footer">

        <p>
            © 2026 Baby Kid • Admin Panel
        </p>

    </footer>


    <script src="admin.js"></script>

</body>

</html>
